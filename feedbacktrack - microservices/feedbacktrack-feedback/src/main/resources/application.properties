spring.application.name=feedbacktrack-feedback-service
server.port=3000

spring.datasource.url=jdbc:mysql://localhost:3306/project-feedback?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.cognizant.training.feedbacktrack=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.springframework.security=DEBUG

# Enable Virtual Threads (Highly recommended for MVC Gateways in Boot 4)
spring.threads.virtual.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Force the service to register its IP address instead of hostname
eureka.instance.prefer-ip-address=true