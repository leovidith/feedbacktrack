spring.application.name=api-gateway

server.port=8088

# Enable Virtual Threads (Highly recommended for MVC Gateways in Boot 4)
spring.threads.virtual.enabled=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway MVC (Oakwood Version)
# Note the 'server.webmvc' addition to the namespace
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# Manual Route Example
spring.cloud.gateway.server.webmvc.routes[0].id=feedbacktrack-feedback-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://FEEDBACKTRACK-FEEDBACK-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args[pattern]=/api/v1/feedback/**

spring.cloud.gateway.server.webmvc.routes[1].id=feedbacktrack-recognition-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://FEEDBACKTRACK-RECOGNITION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].args[pattern]=/api/v1/recognition/**

spring.cloud.gateway.server.webmvc.routes[2].id=feedbacktrack-manager-review-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://FEEDBACKTRACK-MANAGER-REVIEW-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[2].predicates[0].args[pattern]=/api/v1/manager/**

spring.cloud.gateway.server.webmvc.routes[3].id=feedbacktrack-auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://FEEDBACKTRACK-AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[3].predicates[0].args[pattern]=/api/admin/**

spring.cloud.gateway.server.webmvc.routes[4].id=feedbacktrack-notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://FEEDBACKTRACK-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[4].predicates[0].args[pattern]=/api/v1/notifications/**
