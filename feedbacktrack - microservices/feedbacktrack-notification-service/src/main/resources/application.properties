spring.application.name=feedbacktrack-notification-service
server.port=1931

spring.datasource.url=jdbc:mysql://localhost:3306/project-notification?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include = *

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Force the service to register its IP address instead of hostname
eureka.instance.prefer-ip-address=true

jwt.secret=FeedbackTrackProjectSecretKey2026!
