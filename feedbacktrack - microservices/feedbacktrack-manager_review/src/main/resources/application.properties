spring.application.name=feedbacktrack-manager-review-service
server.port=3002

spring.datasource.url=jdbc:mysql://localhost:3306/project-manager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

# Enable Virtual Threads (Highly recommended for MVC Gateways in Boot 4)
spring.threads.virtual.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Force the service to register its IP address instead of hostname
eureka.instance.prefer-ip-address=true

